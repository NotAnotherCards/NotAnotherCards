name: Browser tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
      timezone: Europe/Berlin

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  browser:
    name: Browser tests (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install stable Chrome and system dependencies
        run: pnpm --filter web exec playwright install --with-deps --force chrome
      - name: Log Chrome version
        run: google-chrome --version
      - name: Check browser test types
        run: pnpm --filter web e2e:typecheck
      - name: Run browser tests against Compose and nginx
        run: pnpm e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/playwright-logs/
          retention-days: 7
