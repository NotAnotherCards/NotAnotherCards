name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: run CI pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Turborepo Cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm lint

      - name: Check Formatting
        run: pnpm format:check

      - name: Run Unit Tests
        run: pnpm test
        env:
          # the sync suites create and drop their own database per run
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/postgres
          BETTER_AUTH_SECRET: ci-only-secret
          BETTER_AUTH_URL: http://localhost:3000
          FRONTEND_URL: http://localhost:5173
          GOOGLE_CLIENT_ID: dummy-google-client-id
          GOOGLE_CLIENT_SECRET: dummy-google-client-secret
          FACEBOOK_CLIENT_ID: dummy-facebook-client-id
          FACEBOOK_CLIENT_SECRET: dummy-facebook-client-secret

      - name: Validate Infrastructure Configs
        run: pnpm test:infra
        env:
          GRAFANA_ADMIN_PASSWORD: ci-test-password
          POSTGRES_EXPORTER_DATA_SOURCE_NAME: postgresql://ci:ci@localhost:5432/postgres?sslmode=disable

      - name: Build & Verify
        run: pnpm build 
