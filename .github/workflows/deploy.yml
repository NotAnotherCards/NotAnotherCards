name: Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://app.notanothercards.com
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          port: 22
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/notanothercards
            git fetch origin main
            git reset --hard origin/main

            # 1. Deploy App Bundle
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.production.yml \
              up -d --build --wait

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.production.yml \
              ps

            # 2. Deploy Monitoring Stack
            test -f infra/monitoring/.env || {
              echo "FATAL: infra/monitoring/.env is missing on VPS" >&2
              exit 1
            }

            # One-time migration from the pre-#188 secret-file layout. Keep the
            # webhook in the required mode-600 monitoring .env from now on.
            if ! grep -Eq '^SLACK_WEBHOOK_URL=.+$' infra/monitoring/.env; then
              legacy_slack_secret=infra/monitoring/secrets/slack_webhook
              if [ ! -s "$legacy_slack_secret" ]; then
                echo "FATAL: set SLACK_WEBHOOK_URL in infra/monitoring/.env" >&2
                exit 1
              fi
              # The legacy file is owned by Alertmanager's uid with mode 400,
              # so read it through an isolated root container without placing
              # the secret on the command line or in container environment.
              legacy_slack_webhook="$(
                docker run --rm --network none --read-only --user 0:0 \
                  --volume "$PWD/$legacy_slack_secret:/run/legacy-slack-webhook:ro" \
                  --entrypoint /bin/cat \
                  prom/alertmanager:v0.34.0 \
                  /run/legacy-slack-webhook | tr -d '\r\n'
              )"
              case "$legacy_slack_webhook" in
                https://hooks.slack.com/services/* | https://hooks.slack-gov.com/services/*) ;;
                *)
                  echo "FATAL: legacy Slack webhook has an unexpected URL" >&2
                  exit 1
                  ;;
              esac
              printf '\nSLACK_WEBHOOK_URL=%s\n' "$legacy_slack_webhook" >> infra/monitoring/.env
              chmod 600 infra/monitoring/.env
              unset legacy_slack_webhook
              echo "Migrated the legacy Slack webhook into infra/monitoring/.env"
            fi
            chmod 600 infra/monitoring/.env

            docker compose \
              -f infra/monitoring/docker-compose.yml \
              --env-file infra/monitoring/.env \
              up -d --wait

            docker compose \
              -f infra/monitoring/docker-compose.yml \
              --env-file infra/monitoring/.env \
              ps

            # 3. Verify Internal Monitoring Services
            curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-all-errors --retry-delay 3 http://127.0.0.1:9090/-/healthy
            curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-all-errors --retry-delay 3 http://127.0.0.1:3001/api/health
            curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-all-errors --retry-delay 3 http://127.0.0.1:9093/-/healthy

            # 4. Verify the Compose-managed Slack secret is mounted for Alertmanager
            docker compose \
              -f infra/monitoring/docker-compose.yml \
              --env-file infra/monitoring/.env \
              exec -T -u 65534 alertmanager \
              cat /run/secrets/slack_webhook >/dev/null || {
              echo "FATAL: slack_webhook not readable by alertmanager (uid 65534)" >&2
              exit 1
            }

            # 5. Verify every named Prometheus scrape target is up
            for job in prometheus api-vps postgres-vps node-vps litellm-gx10 dcgm-gpu-gx10 node-gx10; do
              health="missing"
              for attempt in 1 2 3 4 5 6; do
                health=$(curl -s http://127.0.0.1:9090/api/v1/targets \
                  | jq -r --arg j "$job" '[.data.activeTargets[] | select(.labels.job == $j) | .health] | first // "missing"')
                [ "$health" = "up" ] && break
                sleep 10
              done
              if [ "$health" != "up" ]; then
                echo "FATAL: Prometheus target '$job' is '$health'" >&2
                exit 1
              fi
              echo "Prometheus target '$job' is up"
            done

            # 6. Verify production Grafana provisioning and datasource connectivity
            grafana_api() {
              local endpoint="$1"
              docker compose \
                -f infra/monitoring/docker-compose.yml \
                --env-file infra/monitoring/.env \
                exec -T grafana sh -ec '
                  auth="$(printf "%s" "$GF_SECURITY_ADMIN_USER:$GF_SECURITY_ADMIN_PASSWORD" | base64 | tr -d "\n")"
                  wget -qO- --header "Authorization: Basic $auth" "http://localhost:3000/$1"
                ' sh "$endpoint"
            }

            grafana_api api/datasources/uid/Prometheus \
              | jq -e '.uid == "Prometheus" and .type == "prometheus"' >/dev/null || {
              echo "FATAL: Grafana Prometheus datasource is not provisioned" >&2
              exit 1
            }
            echo "Grafana datasource UID Prometheus is provisioned"

            grafana_api api/datasources/uid/Prometheus/health \
              | jq -e '.status == "OK"' >/dev/null || {
              echo "FATAL: Grafana cannot query the Prometheus datasource" >&2
              exit 1
            }
            echo "Grafana Prometheus datasource health is OK"

            dashboards="$(grafana_api 'api/search?type=dash-db')"
            for uid in nac-ai-queue nac-api-system nac-gx10-gpu; do
              printf '%s' "$dashboards" | jq -e --arg uid "$uid" 'any(.[]; .uid == $uid)' >/dev/null || {
                echo "FATAL: Grafana dashboard '$uid' is not provisioned" >&2
                exit 1
              }
              echo "Grafana dashboard '$uid' is provisioned"
            done

            rules="$(curl --fail --silent --show-error http://127.0.0.1:9090/api/v1/rules)"
            for alert_name in ApiDown PostgresDown LiteLlmGatewayDown Gx10NodeExporterDown Gx10GpuExporterDown AiQueueDepthHigh AiQueueDepthScrapeFailed DiskFilling; do
              printf '%s' "$rules" | jq -e --arg name "$alert_name" \
                'any(.data.groups[].rules[]; .name == $name)' >/dev/null || {
                echo "FATAL: Prometheus alert '$alert_name' is not loaded" >&2
                exit 1
              }
              echo "Prometheus alert '$alert_name' is loaded"
            done

            # 7. Send a real notification through Alertmanager and require Slack success
            smoke_id="${{ github.sha }}-$(date +%s)"
            SLACK_DELIVERY_MAX_ATTEMPTS=15 \
            SLACK_DELIVERY_POLL_SECONDS=2 \
              /bin/sh infra/monitoring/verify-slack-delivery.sh \
                http://127.0.0.1:9093 \
                slack-delivery-smoke \
                MonitoringDeliverySmokeTest \
                info \
                "$smoke_id"

            # 8. Verify Public Endpoints
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-connrefused \
              --retry-all-errors \
              --retry-delay 3 \
              https://app.notanothercards.com/health

            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-connrefused \
              --retry-all-errors \
              --retry-delay 3 \
              https://grafana.notanothercards.com/api/health
