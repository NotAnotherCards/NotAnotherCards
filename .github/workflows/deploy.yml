name: Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://app.notanothercards.com
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          port: 22
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/notanothercards
            git fetch origin main
            git reset --hard origin/main

            # 1. Deploy App Bundle
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.production.yml \
              up -d --build --wait

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.production.yml \
              ps

            # 2. Deploy Monitoring Stack
            test -f infra/monitoring/.env || {
              echo "FATAL: infra/monitoring/.env is missing on VPS" >&2
              exit 1
            }

            docker compose \
              -f infra/monitoring/docker-compose.yml \
              --env-file infra/monitoring/.env \
              up -d --wait

            docker compose \
              -f infra/monitoring/docker-compose.yml \
              --env-file infra/monitoring/.env \
              ps

            # 3. Verify Internal Monitoring Services
            curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-all-errors --retry-delay 3 http://127.0.0.1:9090/-/healthy
            curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-all-errors --retry-delay 3 http://127.0.0.1:3001/api/health
            curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-all-errors --retry-delay 3 http://127.0.0.1:9093/-/healthy

            # 4. Verify the Slack webhook secret is readable by Alertmanager
            docker compose \
              -f infra/monitoring/docker-compose.yml \
              --env-file infra/monitoring/.env \
              exec -T -u 65534 alertmanager \
              cat /etc/alertmanager/secrets/slack_webhook >/dev/null || {
              echo "FATAL: slack_webhook not readable by alertmanager (uid 65534)" >&2
              exit 1
            }

            # 5. Send a real notification through Alertmanager and require a
            # completed, successful Slack HTTP request.
            alertmanager_slack_metric() {
              metric_name="$1"
              curl --fail --silent --show-error http://127.0.0.1:9093/metrics \
                | awk -v sample="${metric_name}{integration=\"slack\"}" \
                  '$1 == sample { print $2; found = 1 } END { if (!found) print 0 }'
            }

            SLACK_REQUESTS_BEFORE="$(alertmanager_slack_metric alertmanager_notification_requests_total)"
            SLACK_FAILURES_BEFORE="$(alertmanager_slack_metric alertmanager_notification_requests_failed_total)"
            SMOKE_STARTS_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            SMOKE_ENDS_AT="$(date -u -d '+5 minutes' +'%Y-%m-%dT%H:%M:%SZ')"

            curl --fail --silent --show-error \
              -H 'Content-Type: application/json' \
              --data "[{\"labels\":{\"alertname\":\"DeploymentSlackSmokeTest\",\"severity\":\"warning\",\"job\":\"deployment-${{ github.sha }}\",\"instance\":\"production-vps\"},\"annotations\":{\"summary\":\"Monitoring deployment Slack smoke test\",\"description\":\"Alertmanager successfully reached the production Slack webhook after deployment ${{ github.sha }}.\"},\"startsAt\":\"$SMOKE_STARTS_AT\",\"endsAt\":\"$SMOKE_ENDS_AT\"}]" \
              http://127.0.0.1:9093/api/v2/alerts >/dev/null

            SLACK_SMOKE_DELIVERED=0
            for attempt in $(seq 1 50); do
              SLACK_REQUESTS_AFTER="$(alertmanager_slack_metric alertmanager_notification_requests_total)"
              SLACK_FAILURES_AFTER="$(alertmanager_slack_metric alertmanager_notification_requests_failed_total)"
              if [ "$SLACK_FAILURES_AFTER" -gt "$SLACK_FAILURES_BEFORE" ]; then
                echo "FATAL: Alertmanager's Slack smoke-test request failed" >&2
                exit 1
              fi
              if [ "$SLACK_REQUESTS_AFTER" -gt "$SLACK_REQUESTS_BEFORE" ]; then
                SLACK_SMOKE_DELIVERED=1
                break
              fi
              sleep 1
            done
            if [ "$SLACK_SMOKE_DELIVERED" != "1" ]; then
              echo "FATAL: Alertmanager did not complete the Slack smoke-test request" >&2
              exit 1
            fi
            echo "Alertmanager delivered the production Slack smoke-test notification"

            # 6. Verify every named Prometheus scrape target is up
            for job in prometheus api-vps postgres-vps node-vps litellm-gx10 dcgm-gpu-gx10 node-gx10; do
              health="missing"
              for attempt in 1 2 3 4 5 6; do
                health=$(curl -s http://127.0.0.1:9090/api/v1/targets \
                  | jq -r --arg j "$job" '[.data.activeTargets[] | select(.labels.job == $j) | .health] | first // "missing"')
                [ "$health" = "up" ] && break
                sleep 10
              done
              if [ "$health" != "up" ]; then
                echo "FATAL: Prometheus target '$job' is '$health'" >&2
                exit 1
              fi
              echo "Prometheus target '$job' is up"
            done

            # 7. Verify Public Endpoints
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-connrefused \
              --retry-all-errors \
              --retry-delay 3 \
              https://app.notanothercards.com/health

            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-connrefused \
              --retry-all-errors \
              --retry-delay 3 \
              https://grafana.notanothercards.com/api/health
