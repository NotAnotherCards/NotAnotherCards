name: Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://app.notanothercards.com
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          port: 22
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/notanothercards
            git fetch origin main
            git reset --hard origin/main

            # 1. Deploy App Bundle
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.production.yml \
              up -d --build --wait

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.production.yml \
              ps

            # 2. Deploy Monitoring Stack
            test -f infra/monitoring/.env || {
              echo "FATAL: infra/monitoring/.env is missing on VPS" >&2
              exit 1
            }

            docker compose \
              -f infra/monitoring/docker-compose.yml \
              --env-file infra/monitoring/.env \
              ps

            # 3. Verify Internal Monitoring Services
            curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-all-errors --retry-delay 3 http://127.0.0.1:9090/-/healthy
            curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-all-errors --retry-delay 3 http://127.0.0.1:3001/api/health
            curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-all-errors --retry-delay 3 http://127.0.0.1:9093/-/healthy

            # 4. Verify Prometheus Scrape Targets
            curl --fail --silent --show-error http://127.0.0.1:9090/api/v1/targets | grep -q '"health":"up"'

            # 5. Verify Public Endpoints (App + Grafana HTTPS)
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-connrefused \
              --retry-all-errors \
              --retry-delay 3 \
              https://app.notanothercards.com/health

            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-connrefused \
              --retry-all-errors \
              --retry-delay 3 \
              https://grafana.notanothercards.com/api/health
