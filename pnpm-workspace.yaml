packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
overrides:
  typescript: 5.9.3
  react: 19.2.3
  react-dom: 19.2.3
  # one core instance workspace-wide; differing @types/node peers
  # otherwise split it into two and break shared Model types
  '@remelondb/core': 0.3.1
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.4'
  - '@turbo/darwin-arm64@2.10.4'
  - '@turbo/linux-64@2.10.4'
  - '@turbo/linux-arm64@2.10.4'
  - '@turbo/windows-64@2.10.4'
  - '@turbo/windows-arm64@2.10.4'
  - turbo@2.10.4
  - '@remelondb/core@0.3.1'
  - '@remelondb/driver-web@0.3.1'
  - '@remelondb/driver-node@0.3.1'
  - '@remelondb/nestjs@0.3.1'
  - '@remelondb/server@0.3.1'
  - '@remelondb/store-drizzle@0.3.1'
  - '@expo/metro-runtime@57.0.7'
  - expo-constants@57.0.7
  - expo-linking@57.0.4 || 57.0.11
  - expo-router@57.0.8 || 57.0.23
  - '@remelondb/driver-rn@0.3.1'
  - '@expo/ui@57.0.20'
  - expo-glass-effect@57.0.4
  - '@expo/cli@57.0.27'
  - '@expo/router-server@57.0.11'
  - babel-preset-expo@57.0.13
  - expo-modules-core@57.0.19
  - expo-modules-jsi@57.1.1
  - expo@57.0.25
