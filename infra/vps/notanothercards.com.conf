# HTTP bootstrap configuration for the apex landing page on the production VPS.
# Certbot adds TLS and the HTTP-to-HTTPS redirect to the installed host copy.
server {
  listen 80;
  listen [::]:80;
  server_name notanothercards.com;

  location / {
    # The landing container serves the static legal pages and is loopback-only.
    proxy_pass http://127.0.0.1:5174;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
