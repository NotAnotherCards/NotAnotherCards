
server {
  listen 443 ssl;
  server_name ai.dustyway.org;

  # Maintenance switch: create or remove
  # conf.d/maintenance.on . No reload needed, nginx tests the file
  # per request.
  if (-f /etc/nginx/conf.d/maintenance.on) {
    return 503;
  }

  error_page 503 = @maintenance;

  location @maintenance {
    default_type application/json;
    add_header Retry-After 3600 always;
    return 503 '{"error":{"message":"ai.dustyway.org is down for a scheduled benchmark on the GX10. Ping dustyway if you need it back.","type":"service_unavailable","code":"maintenance"}}';
  }

  # Prometheus on the team VPS scrapes the GX10 through here until #193 puts
  # it on the tailnet. All three upstreams are unauthenticated and the
  # LiteLLM series carry key aliases and spend, so they stay fenced to that
  # one IP. Exact-match locations: nothing else under these paths is exposed.
  location = /metrics {
    allow 169.58.127.208;  # app.notanothercards.com
    deny all;

    # Trailing slash on purpose: LiteLLM answers /metrics with a 307 to
    # /metrics/ whose Location carries its tailnet address, which a scraper
    # outside the tailnet cannot follow.
    proxy_pass http://100.64.0.1:4000/metrics/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /dcgm/metrics {
    allow 169.58.127.208;
    deny all;
    proxy_pass http://100.64.0.1:9400/metrics;
    proxy_set_header Host $host;
  }

  location = /node/metrics {
    allow 169.58.127.208;
    deny all;
    proxy_pass http://100.64.0.1:9100/metrics;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://100.64.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # SSE streaming: pass tokens through, allow slow generations
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}

server {
  listen 80;
  server_name ai.dustyway.org;
  return 301 https://$host$request_uri;
}
