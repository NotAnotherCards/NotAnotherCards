
server {
  listen 443 ssl;
  server_name ai.dustyway.org;

  # Maintenance switch: create or remove
  # conf.d/maintenance.on . No reload needed, nginx tests the file
  # per request.
  if (-f /etc/nginx/conf.d/maintenance.on) {
    return 503;
  }

  error_page 503 = @maintenance;

  location @maintenance {
    default_type application/json;
    add_header Retry-After 3600 always;
    return 503 '{"error":{"message":"ai.dustyway.org is down for a scheduled benchmark on the GX10. Ping dustyway if you need it back.","type":"service_unavailable","code":"maintenance"}}';
  }

  # Production scrapes all three metrics endpoints directly over the tailnet
  location ~ ^/(metrics/?|dcgm/metrics|node/metrics)$ {
    return 404;
  }

  location / {
    proxy_pass http://100.64.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # SSE streaming: pass tokens through, allow slow generations
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}

server {
  listen 80;
  server_name ai.dustyway.org;
  return 301 https://$host$request_uri;
}
