# Public endpoint for the GX10 AI gateway (issue #85).
# Deployed in the VPS's nginx conf.d; proxies over the tailnet to litellm.
server {
  listen 443 ssl;
  server_name ai.dustyway.org;

  location / {
    proxy_pass http://100.64.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # SSE streaming: pass tokens through, allow slow generations
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}

server {
  listen 80;
  server_name ai.dustyway.org;
  return 301 https://$host$request_uri;
}
