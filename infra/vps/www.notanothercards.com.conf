# HTTP bootstrap configuration for the production www alias.
# Certbot adds TLS to the installed host copy; use --no-redirect so both
# protocols keep this direct redirect to the canonical landing hostname.
server {
  listen 80;
  listen [::]:80;
  server_name www.notanothercards.com;

  return 301 https://notanothercards.com$request_uri;
}
