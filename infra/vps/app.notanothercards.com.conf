# HTTP bootstrap configuration for the production VPS.
# Certbot adds TLS and the HTTP-to-HTTPS redirect to the installed host copy.
server {
  listen 80;
  listen [::]:80;
  server_name app.notanothercards.com;

  location / {
    # The web container serves the SPA and proxies /api/ and /sync/ internally.
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
