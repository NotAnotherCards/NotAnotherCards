# Public endpoint for the application bundle on VPS.
# Deployed in the VPS's /etc/nginx/sites-available/ (or conf.d) and symlinked to sites-enabled.

server {
  listen 80;
  listen [::]:80;
  server_name app.notanothercards.com;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name app.notanothercards.com;

  # Managed by Certbot on host
  ssl_certificate /etc/letsencrypt/live/app.notanothercards.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.notanothercards.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # Forward everything to the Web container reverse proxy
  location / {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Support SSE streaming and long polling without premature timeouts
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
