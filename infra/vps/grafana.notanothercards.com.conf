# HTTP bootstrap configuration for Grafana monitoring on the production VPS.
# Certbot adds TLS and the HTTP-to-HTTPS redirect to the installed host copy.
server {
  listen 80;
  listen [::]:80;
  server_name grafana.notanothercards.com;

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support for live Grafana dashboard updates
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
