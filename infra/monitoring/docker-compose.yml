services:
  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    environment:
      GX10_METRICS_MODE: ${GX10_METRICS_MODE:-proxy}
      GX10_METRICS_HOST: ${GX10_METRICS_HOST:-ai.dustyway.org}
    volumes:
      - ./prometheus/prometheus.yml.template:/etc/prometheus/prometheus.yml.template:ro
      - ./prometheus/render-config.sh:/usr/local/bin/render-prometheus-config:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    # Prometheus does not expand environment variables in its config file,
    # so the entrypoint renders the template before starting the server.
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        /bin/sh /usr/local/bin/render-prometheus-config \
          /etc/prometheus/prometheus.yml.template \
          /prometheus/prometheus.yml
        exec /bin/prometheus \
          --config.file=/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=30d \
          --web.enable-lifecycle
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider http://localhost:9090/-/healthy || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - default
      - app_net

  grafana:
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3001}:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SECURITY_COOKIE_SECURE: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.notanothercards.com}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 45s
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - default

  alertmanager:
    image: prom/alertmanager:v0.34.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    secrets:
      - slack_webhook
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        test -s /run/secrets/slack_webhook || {
          echo 'FATAL: Slack webhook secret file is empty' >&2
          exit 1
        }
        exec /bin/alertmanager \
          --config.file=/etc/alertmanager/alertmanager.yml \
          --storage.path=/alertmanager \
          --enable-feature=receiver-name-in-metrics
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider http://localhost:9093/-/healthy || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - default

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    pid: host
    ports:
      - '127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100'
    volumes:
      - /:/host:ro
    command:
      - '--path.rootfs=/host'
    networks:
      - default

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    ports:
      - '127.0.0.1:${POSTGRES_EXPORTER_PORT:-9187}:9187'
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DATA_SOURCE_NAME}
    networks:
      - default
      - app_net

  # Validation-only Slack-compatible endpoint. It records POSTs in memory so
  # test:infra proves Alertmanager performed an actual webhook request.
  slack-webhook-mock:
    image: node:24-alpine
    profiles: ['validation']
    command:
      - node
      - -e
      - |
        const http = require('http');
        let deliveries = 0;
        let rejectedRequests = 0;
        http.createServer((req, res) => {
          if (req.method === 'POST') {
            req.resume();
            req.on('end', () => {
              if (req.url.startsWith('/fail')) {
                rejectedRequests += 1;
                res.writeHead(503, { 'content-type': 'text/plain' });
                res.end('temporarily unavailable');
                return;
              }
              deliveries += 1;
              res.writeHead(200, { 'content-type': 'text/plain' });
              res.end('ok');
            });
            return;
          }
          if (req.url === '/count') {
            res.writeHead(200, { 'content-type': 'text/plain' });
            res.end(String(deliveries));
            return;
          }
          if (req.url === '/failed-count') {
            res.writeHead(200, { 'content-type': 'text/plain' });
            res.end(String(rejectedRequests));
            return;
          }
          res.writeHead(404);
          res.end('not found');
        }).listen(8080, '0.0.0.0');
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:8080/count']
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - default

networks:
  default:
  app_net:
    name: notanothercards_default
    external: true

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:

secrets:
  slack_webhook:
    # Production provisions this ignored file with mode 0400.
    file: ${SLACK_WEBHOOK_FILE:-./secrets/slack_webhook}
