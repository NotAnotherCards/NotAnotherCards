services:
  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider http://localhost:9090/-/healthy || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - default
      - app_net

  grafana:
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3001}:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SECURITY_COOKIE_SECURE: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.notanothercards.com}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - default

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    ports:
      - '127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider http://localhost:9093/-/healthy || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 45s
    networks:
      - default

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    pid: host
    ports:
      - '127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100'
    volumes:
      - /:/host:ro
    command:
      - '--path.rootfs=/host'
    networks:
      - default

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    ports:
      - '127.0.0.1:${POSTGRES_EXPORTER_PORT:-9187}:9187'
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DATA_SOURCE_NAME}
    networks:
      - default
      - app_net

networks:
  default:
  app_net:
    name: notanothercards_default
    external: true

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
