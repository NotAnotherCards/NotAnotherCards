services:
  node-exporter:
    ports: !reset []

  postgres-exporter:
    ports: !reset []

  alertmanager:
    volumes:
      - type: bind
        source: ${VALIDATION_SLACK_WEBHOOK_FILE:?VALIDATION_SLACK_WEBHOOK_FILE is required}
        target: /etc/alertmanager/secrets/slack_webhook
        read_only: true

  webhook-receiver:
    image: node:24-alpine
    restart: 'no'
    volumes:
      - ./test/webhook-receiver.mjs:/app/webhook-receiver.mjs:ro
    command: ['node', '/app/webhook-receiver.mjs']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
